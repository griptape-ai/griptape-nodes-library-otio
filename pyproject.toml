[project]
name = "otio_nodes"
version = "0.1.0"
description = "Griptape Nodes library that turns a Fountain script into an OpenTimelineIO timeline, with a timeline editor widget"
authors = [{ name = "Griptape", email = "support@griptape.ai" }]
readme = "README.md"
requires-python = "~=3.12.0"
dependencies = ["OpenTimelineIO>=0.17.0", "Pillow>=10.0.0", "static-ffmpeg>=3.0"]

[tool.uv.sources]
griptape-nodes-engine = { git = "https://github.com/griptape-ai/griptape-nodes-engine", rev = "latest" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["otio_nodes"]

[dependency-groups]
dev = ["pyright>=1.1.396", "pytest-asyncio>=0.21.0", "ruff>=0.8.0", "pytest", "griptape-nodes-engine>=0.104.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
# Preconfigured workflows are generated by the editor, so they are not formatted or linted.
extend-exclude = ["preconfigured_workflows"]

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "W",  # pycodestyle warnings
  "F",  # Pyflakes
  "I",  # isort
  "B",  # flake8-bugbear
  "C4", # flake8-comprehensions
  "UP", # pyupgrade
]
ignore = [
  "E501", # line too long (handled by formatter)
  "B008", # do not perform function calls in argument defaults
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["."]
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*", "templates", "preconfigured_workflows"]
pythonVersion = "3.12"
reportIncompatibleMethodOverride = false
